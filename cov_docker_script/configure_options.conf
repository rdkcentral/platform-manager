# platform-manager configure options
# This file contains autotools configure options for the platform-manager component

# ============================================================================
# ============================================================================
# CPPFLAGS - Preprocessor flags (includes and defines)
# ============================================================================
[CPPFLAGS]

# Autotools configuration
-DHAVE_CONFIG_H
-DSAFEC_DUMMY_API

# Include paths
-I$HOME/usr/include/rdkb
-I/usr/include/dbus-1.0
-I/usr/lib/x86_64-linux-gnu/dbus-1.0/include

# Network features
-DSUPPORT_IPV6
-DSKY
-DSKY_IPV6
-DFEATURE_RDKB_WAN_MANAGER
-DFEATURE_RDKB_LED_MANAGER
-DFEATURE_RDKB_CONFIGURABLE_WAN_INTERFACE
-DFEATURE_802_1P_COS_MARKING
-DETH_4_PORTS
-DENABLE_ETH_WAN
-DETH_STATS_ENABLED
-D_BRIDGE_UTILS_BIN_
-DFEATURE_FWUPGRADE_MANAGER
-DWAN_MANAGER_UNIFICATION_ENABLED

# Build system
-DBRCM_CMS_MSG

# Product/Platform defines
-D_SKY_HUB_COMMON_PRODUCT_REQ_
-D_COSA_INTEL_USG_ARM_
-D_COSA_FOR_COMCAST_
-D_COSA_BCM_ARM_

# System features
-DFEATURE_SUPPORT_RDKLOG
-DFEATURE_SUPPORT_SYSLOG
-DBUILD_WEB
-DUSE_NOTIFY_COMPONENT
-DNTPD_ENABLE
-DUTC_ENABLE
-DXDNS_ENABLE
-UNTPD_ENABLE
-DNAT46_KERNEL_SUPPORT
-DRBUS_BUILD_FLAG_ENABLE

# Core system defines
-D_COSA_HAL_
-U_COSA_SIM_
-DCONFIG_SYSTEM_MOCA

# ANSC framework defines
-D_ANSC_LINUX
-D_ANSC_USER
-D_ANSC_LITTLE_ENDIAN_
-D_ANSC_USE_OPENSSL_
-D_ANSC_AES_USED_
-U_ANSC_IPV6_COMPATIBLE_
-U_ANSC_LITTLE_ENDIAN_
-D_NO_ANSC_ZLIB_

# CCSP/Component defines
-D_CCSP_CWMP_TCP_CONNREQ_HANDLER
-D_DSLH_STUN_
-D_NO_PKI_KB5_SUPPORT
-D_BBHM_SSE_FILE_IO
-DCCSP_SUPPORT_ENABLED

# Security & Debugging defines
-DENABLE_SA_KEY
-D_NO_EXECINFO_H_
-D_DEBUG
-DINCLUDE_BREAKPAD
-DFEATURE_SUPPORT_ONBOARD_LOGGING

# MoCA features
-DMOCA_HOME_ISOLATION

# WiFi features
-D_ENABLE_BAND_STEERING_
-D_BEACONRATE_SUPPORT
-DFEATURE_SUPPORT_MESH
-DFEATURE_SUPPORT_WEBCONFIG
-DCONFIG_DFS
-DFEATURE_OFF_CHANNEL_SCAN_5G

# Advanced features
-DMAPT_UNIFICATION_ENABLED

#Other defines
-D_ENABLE_DSL_SUPPORT_
-D_HUB4_PRODUCT_REQ_
-DSKY_BFD_IMPLEMENTATION
-DHUB4_WLDM_SUPPORT
-DHUB4_SDK_L07
-DFEATURE_RDKB_TELCOVOICE_MANAGER
-DFEATURE_RDKB_WAN_UPSTREAM
-DFEATURE_RDKB_AUTO_PORT_SWITCH
-DIPOE_HEALTH_CHECK_LAN_SYNC_SUPPORT
-DMAPT_NAT46_FTP_ACTIVE_MODE
-DNTP_STATUS_SYNC_EVENT
-DWAN_STATUS_LED_EVENT
-DWAN_MANAGER_SELECTION_SCAN_TIMEOUT_DISABLE
-DFEATURE_MAPT
-DFEATURE_MAPT_DEBUG
-DFEATURE_RDKB_XDSL_PPP_MANAGER

# ============================================================================
# CFLAGS - Compiler flags
# ============================================================================
[CFLAGS]
-ffixed-r8
-feliminate-unused-debug-types
-fno-exceptions
-ffunction-sections
-fdata-sections
-fomit-frame-pointer
-fno-strict-aliasing
-fPIC

# ============================================================================
# LDFLAGS - Linker flags
# ============================================================================
[LDFLAGS]
-L$HOME/usr/local/lib
-Wl,--allow-shlib-undefined
-Wl,--unresolved-symbols=ignore-all
